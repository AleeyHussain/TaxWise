<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="tw-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: var(--accent-primary, #2563EB);" />
      <stop offset="100%" style="stop-color: var(--accent-cta, #06B6D4);" />
    </linearGradient>
  </defs>

  <!-- Rounded badge -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#tw-gradient)" />

  <!-- Letters "TW" -->
  <g fill="none" stroke="var(--bg-base, #FFFFFF)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter T -->
    <path d="M 24 44 L 56 44" />
    <path d="M 40 44 L 40 86" />

    <!-- Letter W with personality: middle dip + right leg lift -->
    <path d="M 64 44 L 73 86 L 84 55 L 95 88 L 105 38" />
  </g>

  <!-- Sparkle star at top-right corner (12 units) -->
  <path d="M 106 14 Q 106 20 100 20 Q 106 20 106 26 Q 106 20 112 20 Q 106 20 106 14 Z" fill="#FFFFFF" fill-opacity="0.9" />
</svg>
